services:
  postgres:
    image: postgres:16-alpine
    container_name: athenea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athenea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athenea_dev}
      POSTGRES_DB: ${POSTGRES_DB:-athenea_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-athenea} -d ${POSTGRES_DB:-athenea_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: athenea-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@athenea.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: athenea-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: athenea-auth-service
    restart: unless-stopped
    command: node src/server.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-athenea}:${POSTGRES_PASSWORD:-athenea_dev}@postgres:5432/${POSTGRES_DB:-athenea_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_minimum_16chars}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      AUTH_SERVICE_PUBLIC_URL: ${AUTH_SERVICE_PUBLIC_URL:-http://localhost:8080/api/auth}
    ports:
      - "3001:3001"

  clinical-service:
    build:
      context: ./backend/clinical-service
    container_name: athenea-clinical-service
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NODE_ENV: development
      PORT: 3002
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_minimum_16chars}
      CLINICAL_CACHE_TTL_SECONDS: ${CLINICAL_CACHE_TTL_SECONDS:-300}
    ports:
      - "3002:3002"

  ia-service:
    build:
      context: ./backend/ia-service
    container_name: athenea-ia-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3003
    ports:
      - "3003:3003"

  
      

  gateway:
    build:
      context: ./backend/gateway
    container_name: athenea-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - clinical-service
      - ia-service
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data: